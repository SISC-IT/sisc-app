workflows:
  ios-appstore:
    name: iOS App Store
    max_build_duration: 60
    integrations:
      app_store_connect: sumtagi-appstore
    environment:
      groups:
        - sisc
      vars:
        BUNDLE_ID: "kr.sisc.siscApp"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Fetch signing files
        script: |
          set -e

          CERT_JSON=$(app-store-connect certificates list \
            --type DISTRIBUTION \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --save --json)
          CERT_ID=$(echo "$CERT_JSON" | jq -r '.[0].id // empty')

          if [ -z "$CERT_ID" ]; then
            CERT_ID=$(app-store-connect certificates create \
              --type DISTRIBUTION \
              --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
              --save --json | jq -r '.id')
          fi
          echo "Using certificate: $CERT_ID"

          BUNDLE_RESOURCE_ID=$(app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier --json | jq -r '.[0].id')
          echo "Bundle ID resource: $BUNDLE_RESOURCE_ID"

          # Profile is bound to exactly this certificate only, so the keychain
          # never has to choose between it and the unrelated existing
          # certificate that Codemagic doesn't hold the private key for.
          PROFILE_NAME="SISC App Store $(date +%s)"
          app-store-connect profiles create "$BUNDLE_RESOURCE_ID" \
            --certificate-ids="$CERT_ID" \
            --type=IOS_APP_STORE \
            --name="$PROFILE_NAME" \
            --save
          echo "$PROFILE_NAME" > /tmp/profile_name.txt

      - name: Install Apple WWDR intermediate certificates
        script: |
          for cer in AppleWWDRCAG2 AppleWWDRCAG3 AppleWWDRCAG4 AppleWWDRCAG5 AppleWWDRCAG6; do
            curl -sLo "/tmp/$cer.cer" "https://www.apple.com/certificateauthority/$cer.cer"
            security import "/tmp/$cer.cer" || true
          done

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;

      - name: Set up export options plist
        script: |
          PROFILE_NAME=$(cat /tmp/profile_name.txt)
          cat > /Users/builder/export_options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>5P4GP446SF</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          PLIST
          cat /Users/builder/export_options.plist

      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - kimsungil322@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
