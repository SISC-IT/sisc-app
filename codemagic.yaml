workflows:
  ios-appstore:
    name: iOS App Store
    max_build_duration: 60
    integrations:
      app_store_connect: sumtagi-appstore
    environment:
      groups:
        - sisc
      ios_signing:
        distribution_type: app_store
        bundle_identifier: kr.sisc.siscApp
      vars:
        BUNDLE_ID: "kr.sisc.siscApp"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;

      - name: Flutter build ipa
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - kimsungil322@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
